version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecs-dashboard-frontend
    ports:
      - "7777:7777"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Useful for hot-reloading on Windows hosts
      - VITE_PORT=7777
    # Use standard restart policy
    restart: unless-stopped
